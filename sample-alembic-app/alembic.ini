# ============================================================================
# ALEMBIC.INI
# ============================================================================
# Standardowy plik konfiguracyjny Alembika. sqlalchemy.url NIE jest tu
# faktycznie używany do połączenia — nadpisujemy go w env.py wartością
# ze zmiennej środowiskowej DATABASE_URL (patrz alembic/env.py), więc
# ta linijka poniżej to tylko wymagany placeholder, żeby Alembic się
# nie wywalił przy starcie.
# ============================================================================
[alembic]
script_location = alembic
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S