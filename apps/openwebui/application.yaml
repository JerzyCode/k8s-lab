apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openwebui
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JerzyCode/k8s-lab
    targetRevision: main
    path: apps/openwebui
  destination:
    server: https://kubernetes.default.svc
    namespace: lab
  syncPolicy:
    syncOptions:
      - CreateNamespace=true