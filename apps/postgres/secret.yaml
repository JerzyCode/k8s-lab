# ============================================================================
# SECRET.YAML — Postgres
# ============================================================================
# Secret to obiekt K8s do przechowywania danych wrażliwych (hasła, tokeny).
# Wartości w "stringData" Kubernetes sam zakoduje do base64 przy zapisie
# (to NIE jest szyfrowanie — base64 to tylko encoding, każdy z dostępem
# do klastra może to odkodować; do prawdziwej ochrony potrzebny byłby
# zewnętrzny mechanizm, np. Sealed Secrets albo Vault — pomijamy to w labie).
#
# Ten Secret jest później "wciągany" do kontenera Postgresa przez `envFrom`
# w deployment.yaml, więc te trzy zmienne stają się zmiennymi środowiskowymi
# wewnątrz kontenera (oficjalny obraz postgres:16 sam z nich korzysta,
# żeby zainicjować bazę przy pierwszym starcie).
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: lab
type: Opaque
stringData:
  POSTGRES_USER: labuser         # użytkownik, którego Postgres utworzy przy starcie
  POSTGRES_PASSWORD: labpassword  # hasło do tego użytkownika
  POSTGRES_DB: labdb              # nazwa bazy utworzonej automatycznie przy pierwszym starcie